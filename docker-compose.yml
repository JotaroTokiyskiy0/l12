services:
  app:
    build: .
    container_name: fitness_platform_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./fitness.db
    volumes:
      - ./fitness.db:/app/fitness.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/exercises"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

